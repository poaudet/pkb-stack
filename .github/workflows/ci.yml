name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-mcp.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build hub image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: knowledge-hub:ci
      - name: Build MCP image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.mcp
          load: true
          push: false
          tags: knowledge-hub-mcp:ci
      - run: docker run --rm knowledge-hub-mcp:ci python -c "import hub_mcp, httpx"
      - name: Smoke test hub
        run: |
          TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name hub -p 5000:5000 -e API_TOKEN="$TOKEN" -e EMBED_BACKEND=fake knowledge-hub:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:5000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:5000/health | grep -q '"status"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/stats)" = 401
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:5000/api/stats
