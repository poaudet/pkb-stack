<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Hub</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav id="tabs" aria-label="Main navigation">
  <button data-tab="capture" class="active">Capture <span class="nav-badge" id="capture-badge"></span></button>
  <button data-tab="search">Search</button>
  <button data-tab="add">Add</button>
  <button data-tab="review" id="tab-review-btn" hidden>Review <span id="review-count"></span></button>
  <button data-tab="browse">Browse</button>
  <button data-tab="entities">Entities</button>
  <button data-tab="status">Status</button>
</nav>
<main>
  <section id="tab-capture">
    <div class="capture-layout">
      <div class="capture-left">
        <section id="capture-composer" aria-labelledby="capture-composer-title">
          <h1 id="capture-composer-title">Capture</h1>
          <p id="capture-privacy" class="capture-privacy" aria-live="polite">Loading AI settings…</p>
          <div id="capture-owner"></div>
          <label for="capture-text">What would you like to remember?</label>
          <textarea id="capture-text" rows="6" maxlength="8000" autocapitalize="sentences"
            spellcheck="true" enterkeyhint="send"></textarea>
          <p id="capture-count" class="meta" aria-live="polite">0/8000</p>
          <details>
            <summary>Add context</summary>
            <label for="capture-hint">Context</label>
            <input id="capture-hint" type="text" maxlength="1000">
          </details>
          <label for="capture-as-of">As of</label>
          <input id="capture-as-of" type="date">
          <label class="capture-skip-label">
            <input id="capture-skip-ai" type="checkbox">
            Save as note without AI
          </label>
          <div id="capture-error" class="capture-error" role="alert" hidden></div>
          <p id="capture-message" role="status" aria-live="polite"></p>
          <div class="capture-submit-bar">
            <button id="capture-submit">Analyze</button>
          </div>
        </section>
        <section id="capture-history-panel" aria-labelledby="capture-history-title">
          <h2 id="capture-history-title">Recent captures</h2>
          <div id="capture-history"></div>
        </section>
      </div>
      <section id="capture-detail" class="capture-detail" hidden aria-labelledby="capture-title">
        <h1 id="capture-title" tabindex="-1">Capture</h1>
        <div id="capture-owner-detail"></div>
        <div id="capture-state" role="status" aria-live="polite" hidden></div>
        <div id="capture-plan" hidden></div>
      </section>
    </div>
  </section>
  <section id="tab-search">
    <input id="q" type="search" placeholder="Search your notes" autocomplete="off">
    <label><input id="inc-sup" type="checkbox"> include superseded</label>
    <div id="hits"></div>
  </section>
  <section id="tab-add" hidden>
    <label for="add-title">Title (optional)</label>
    <input id="add-title" type="text" placeholder="Title (optional)">
    <label for="add-content">Note text</label>
    <textarea id="add-content" rows="10" placeholder="Write a note (markdown)"></textarea>
    <label for="add-tags">Tags, comma separated</label>
    <input id="add-tags" type="text" placeholder="tags, comma separated">
    <label id="add-tidy-row" hidden><input id="add-tidy" type="checkbox" checked> Let AI tidy this first</label>
    <button id="add-save">Save</button>
    <button id="add-to-capture" class="secondary">Analyze into records →</button>
    <p id="add-msg"></p>
  </section>
  <section id="tab-review" hidden>
    <div id="r-list"></div>
  </section>
  <section id="tab-browse" hidden>
    <select id="b-status">
      <option value="">all statuses</option>
      <option value="current" selected>current</option>
      <option value="superseded">superseded</option>
      <option value="archived">archived</option>
    </select>
    <input id="b-tag" type="text" placeholder="filter by tag">
    <div id="b-list"></div>
  </section>
  <section id="tab-entities" hidden>
    <label for="e-type">Entity type</label>
    <select id="e-type"></select>
    <button id="e-new">New</button>
    <button id="e-newtype" class="secondary">New type</button>
    <section id="e-type-details" aria-live="polite"></section>
    <div id="e-table"></div>
    <h4>Recent activity</h4>
    <div id="e-activity"></div>
  </section>
  <section id="tab-status" hidden>
    <section id="status-capture" class="card" aria-labelledby="status-capture-title">
      <h2 id="status-capture-title">Capture</h2>
      <div id="status-capture-details"></div>
      <label class="capture-skip-label"><input id="status-skip-ai" type="checkbox">
        Skip AI by default</label>
    </section>
    <section id="status-owner" class="card" aria-labelledby="status-owner-title">
      <h2 id="status-owner-title">Owner</h2>
      <div id="status-owner-form"></div>
    </section>
    <p id="llm-badge"></p>
    <pre id="health"></pre>
    <button id="backup">Backup now</button>
    <p id="backup-msg"></p>
    <input id="token" type="password" placeholder="API token">
    <button id="token-save">Save token</button>
  </section>
  <dialog id="detail"></dialog>
  <dialog id="review-detail"></dialog>
  <dialog id="entity-dialog"></dialog>
  <dialog id="owner-dialog"></dialog>
  <dialog id="type-dialog"></dialog>
  <dialog id="app-confirm-dialog"></dialog>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
