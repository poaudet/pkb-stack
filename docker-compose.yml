name: knowledge-hub
services:
  hub:
    image: ghcr.io/poaudet/pkb-stack/hub:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5000}:5000"
    volumes:
      - hub_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hub_data:
