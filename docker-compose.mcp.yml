name: knowledge-hub

services:
  hub:
    image: ghcr.io/poaudet/pkb-stack/hub:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5000}:5000"
    volumes:
      - hub_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp:
    image: ghcr.io/poaudet/pkb-stack/mcp:latest
    restart: unless-stopped
    depends_on:
      - hub
    env_file:
      - path: .env
        required: false
    environment:
      HUB_URL: http://hub:5000
      API_TOKEN: ${API_TOKEN:-}
      MCP_TRANSPORT: streamable-http
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MCP_PORT:-8000}:8000"

volumes:
  hub_data:
