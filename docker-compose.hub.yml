name: knowledge-hub

services:
  hub:
    build:
      context: .
      args:
        EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
    image: knowledge-hub:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5000}:5000"
    volumes:
      - hub_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hub_data:
